<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

<title>apéruno</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@400;500;600;700;800&display=swap');

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body, #root { margin: 0; height: 100%; }

.apr-root {
  --gold:#f4c95d;
  font-family:'Montserrat',sans-serif; color:#f3ecff;
  min-height:100dvh; width:100%; display:flex; justify-content:center;
  background:
    radial-gradient(900px 500px at 15% -5%, rgba(177,91,255,.35), transparent 60%),
    radial-gradient(800px 500px at 95% 8%, rgba(255,59,92,.28), transparent 55%),
    radial-gradient(900px 600px at 50% 110%, rgba(55,166,255,.30), transparent 60%),
    #0a0718;
}
.apr-app { width:100%; max-width:440px; min-height:100dvh; position:relative; padding:22px 18px 34px; }
.apr-serif { font-family:'Marcellus',serif; }
.apr-logo { font-family:'Marcellus',serif; text-align:center; letter-spacing:.5px; }
.apr-logo .a { font-size:54px; line-height:1; background:linear-gradient(180deg,#fff,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 4px 18px rgba(244,201,93,.45)); }
.apr-logo .sub { display:block; margin-top:6px; font-size:12px; letter-spacing:5px; text-transform:uppercase; color:#c9b8ff; opacity:.8; font-family:'Montserrat'; }
.apr-deco { position:absolute; font-size:22px; opacity:.5; }

.btn { appearance:none; border:none; cursor:pointer; font-family:'Montserrat'; font-weight:700; border-radius:18px; padding:18px 16px; font-size:17px; width:100%; color:#fff; display:flex; align-items:center; justify-content:center; gap:12px; transition:transform .12s ease, filter .12s; }
.btn:active { transform:scale(.97); }
.btn .ico { font-size:22px; width:34px; text-align:center; }
.btn-primary { background:linear-gradient(135deg,#ff3b5c,#b15bff); box-shadow:0 12px 30px rgba(177,91,255,.4); }
.btn-blue { background:linear-gradient(135deg,#37a6ff,#5b6bff); box-shadow:0 12px 30px rgba(55,166,255,.35); }
.btn-ghost { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.14); }
.btn-gold { background:linear-gradient(135deg,var(--gold),#e0a93a); color:#3a2a06; box-shadow:0 10px 24px rgba(244,201,93,.3); }
.btn-sm { padding:12px 14px; font-size:14px; border-radius:14px; }
.btn.auto { width:auto; }
.btn:disabled { opacity:.4; }
.back { width:auto; margin-bottom:16px; }

.panel { background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); border-radius:20px; padding:18px; }
.h-title { font-family:'Marcellus',serif; font-size:26px; margin:0 0 4px; }
.muted { color:#b9aee0; font-size:13px; line-height:1.55; }
.dim { opacity:.7; font-size:11px; }
.w { color:#fff; }
.b { font-weight:700; }
.center { text-align:center; }
.center-col { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:6px; }
.row { display:flex; gap:10px; }
.wrap { display:flex; flex-wrap:wrap; gap:8px; }
.space { display:flex; justify-content:space-between; align-items:center; }
.col-gap { display:flex; flex-direction:column; gap:10px; }
.mt { margin-top:10px; } .mb { margin-bottom:12px; } .mb-sm { margin-bottom:8px; } .mt-lg { margin-top:24px; }

.input { width:100%; background:rgba(0,0,0,.28); border:1px solid rgba(255,255,255,.16); color:#fff; border-radius:14px; padding:14px; font-size:16px; font-family:'Montserrat'; }
.input::placeholder { color:#8d83b5; }
.code-input { text-align:center; letter-spacing:10px; font-size:30px; font-family:'Marcellus'; text-transform:uppercase; }

.seg { display:flex; background:rgba(0,0,0,.3); border-radius:14px; padding:5px; gap:5px; }
.seg button { flex:1; border:none; background:transparent; color:#ccc; padding:11px; border-radius:10px; font-weight:700; font-family:'Montserrat'; font-size:14px; }
.seg button.on { color:#fff; }
.seg button.on.chill { background:linear-gradient(135deg,#37a6ff,#27d17c); }
.seg button.on.hard { background:linear-gradient(135deg,#ff3b5c,#b15bff); }

.avatar { border-radius:50%; object-fit:cover; background:#2a2150; display:flex; align-items:center; justify-content:center; font-weight:800; color:#cbbcff; }
.chip { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:999px; padding:8px 12px; font-size:13px; font-weight:600; }

.code-big { font-family:'Marcellus'; font-size:56px; letter-spacing:8px; background:linear-gradient(180deg,#fff,var(--gold)); -webkit-background-clip:text; background-clip:text; color:transparent; margin:6px 0; }
.players-grid { display:flex; flex-wrap:wrap; gap:12px; }
.pcard { display:flex; flex-direction:column; align-items:center; gap:6px; width:70px; }
.pcard .nm { font-size:12px; font-weight:700; max-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.turnbar { text-align:center; font-weight:700; padding:10px; border-radius:14px; margin:4px 0 14px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); }
.turnbar.mine { background:linear-gradient(135deg,rgba(244,201,93,.25),rgba(255,59,92,.2)); border-color:var(--gold); }

.opps { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:6px 0 14px; }
.opp { display:flex; flex-direction:column; align-items:center; gap:5px; width:62px; }
.opp .stack { position:relative; width:34px; height:48px; }
.opp .stack .mini { position:absolute; width:34px; height:48px; border-radius:6px; background:linear-gradient(135deg,#241a4d,#3a2a6e); border:1px solid rgba(255,255,255,.18); }
.opp .nm { font-size:11px; font-weight:700; max-width:62px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.opp.turn .av-wrap { box-shadow:0 0 0 3px var(--gold), 0 0 18px rgba(244,201,93,.7); border-radius:50%; }
.cnt { font-size:10px; color:#c9bdf2; }

.center-zone { display:flex; gap:18px; justify-content:center; align-items:flex-end; margin:10px 0 16px; }
.pile { display:flex; flex-direction:column; align-items:center; gap:6px; }
.pile-card { width:70px; height:100px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-weight:800; }
.pile-back { background:repeating-linear-gradient(45deg,#241a4d,#241a4d 7px,#33245f 7px,#33245f 14px); border:2px solid rgba(255,255,255,.18); color:#cbbcff; font-family:'Marcellus'; }
.pile-empty { border:2px dashed rgba(255,255,255,.18); color:#7d72a8; font-size:11px; text-align:center; font-weight:600; }
.pile-lbl { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:#b9aee0; }

.hand { display:flex; gap:8px; overflow-x:auto; padding:10px 2px 16px; scroll-snap-type:x mandatory; }
.hand::-webkit-scrollbar { height:0; }
.card { flex:0 0 auto; width:96px; height:140px; border-radius:14px; padding:10px; position:relative; color:#fff; scroll-snap-align:center; cursor:pointer; transition:transform .14s; display:flex; flex-direction:column; justify-content:space-between; }
.card:active { transform:translateY(-6px); }
.card .tag { font-size:10px; letter-spacing:1.5px; font-weight:800; opacity:.9; }
.card .big { font-family:'Marcellus'; font-size:20px; line-height:1.05; }
.card .ic { font-size:30px; align-self:flex-end; }

.overlay { position:fixed; inset:0; background:rgba(6,4,16,.82); backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:22px; z-index:40; }
.sheet { width:100%; max-width:404px; max-height:88dvh; overflow-y:auto; background:linear-gradient(180deg,#1b1338,#140e2c); border:1px solid rgba(255,255,255,.14); border-radius:24px; padding:22px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
.cardhead { display:flex; align-items:center; gap:12px; margin-bottom:10px; }
.mini-card { width:46px; height:64px; border-radius:10px; flex:0 0 auto; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; font-size:22px; }

.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:26px; z-index:60; background:linear-gradient(135deg,#1d1440,#2a1d5c); border:1px solid rgba(244,201,93,.4); color:#fff; padding:14px 18px; border-radius:16px; font-weight:600; max-width:88%; text-align:center; box-shadow:0 18px 40px rgba(0,0,0,.5); }
.chrono { position:fixed; top:14px; right:14px; z-index:50; background:rgba(0,0,0,.55); border:1px solid rgba(255,59,92,.5); border-radius:14px; padding:8px 12px; display:flex; flex-direction:column; gap:4px; }
.chrono .one { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700; }
.chrono .t { font-family:'Marcellus'; color:var(--gold); }

.dice-row { display:flex; justify-content:center; gap:24px; margin-bottom:16px; }
.dice { width:84px; height:84px; border-radius:18px; background:#fff; color:#1a1430; display:flex; align-items:center; justify-content:center; font-size:54px; font-weight:800; box-shadow:0 10px 26px rgba(0,0,0,.4); }
.dice.rolling { animation:shake .18s linear infinite; }
@keyframes shake { 0%{transform:translateY(0) rotate(-9deg);}25%{transform:translateY(-5px) rotate(7deg);}50%{transform:translateY(0) rotate(-6deg);}75%{transform:translateY(-4px) rotate(8deg);}100%{transform:translateY(0) rotate(-9deg);} }

.pb-table { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
.pb-row { background:rgba(0,0,0,.22); border-radius:12px; padding:10px 12px; }
.pb-row b { display:block; margin-bottom:2px; }

.fade { animation:fade .4s ease; }
@keyframes fade { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
.pop { animation:pop .35s cubic-bezier(.2,1.4,.5,1); }
@keyframes pop { from{opacity:0; transform:scale(.85);} to{opacity:1; transform:scale(1);} }
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script>
(() => {
  const { useState, useEffect, useRef } = React;
  const ACTION_CARDS = [
    { label: "1 gorg\xE9e", drink: "boit 1 gorg\xE9e", chill: 25, hard: 10 },
    { label: "2 gorg\xE9es", drink: "boit 2 gorg\xE9es", chill: 20, hard: 15 },
    { label: "3 gorg\xE9es", drink: "boit 3 gorg\xE9es", chill: 12, hard: 15 },
    { label: "5 gorg\xE9es", drink: "boit 5 gorg\xE9es", chill: 3, hard: 17 },
    { label: "1 shot", drink: "boit 1 shot", chill: 0, hard: 3 }
  ];
  const GAMES = [
    {
      id: "21",
      name: "Le 21",
      chill: 3,
      hard: 1,
      kind: "offapp",
      rule: "\xC0 tour de r\xF4le, chacun dit 1, 2 ou 3 chiffres qui se suivent, mais jamais le m\xEAme nombre de chiffres que le joueur pr\xE9c\xE9dent. Celui qui tombe sur 21 perd."
    },
    {
      id: "valise",
      name: "La valise",
      chill: 2,
      hard: 2,
      kind: "offapp",
      rule: "Le premier joueur dit un objet \xAB dans sa valise \xBB. Chacun r\xE9p\xE8te la liste et ajoute un objet. Celui qui se trompe perd."
    },
    {
      id: "de",
      name: "D\xE9fi de d\xE9",
      chill: 3,
      hard: 2,
      kind: "inapp_dice",
      rule: "Choisis un adversaire. Vous lancez chacun un d\xE9. Le plus haut gagne et distribue l'\xE9cart en gorg\xE9es."
    },
    {
      id: "categorie",
      name: "Cat\xE9gorie",
      chill: 2,
      hard: 2,
      kind: "offapp",
      rule: "Choisis une cat\xE9gorie. Chacun donne un item \xE0 tour de r\xF4le. Le premier qui s\xE8che perd."
    },
    {
      id: "petitbac",
      name: "Petit bac",
      chill: 4,
      hard: 2,
      kind: "inapp_letter",
      rule: "Une lettre est tir\xE9e. Chacun \xE9crit un mot par cat\xE9gorie commen\xE7ant par cette lettre, avant la fin du chrono."
    },
    {
      id: "nioui",
      name: "Ni oui ni non",
      chill: 1,
      hard: 1,
      kind: "inapp_timer",
      rule: "Pendant 10 minutes, interdit de dire \xAB oui \xBB ou \xAB non \xBB. Chaque personne qui se fait avoir boit une gorg\xE9e."
    },
    {
      id: "motinterdit",
      name: "Mot interdit",
      chill: 2,
      hard: 2,
      kind: "inapp_timer",
      rule: "Le joueur choisit un mot interdit pendant 10 minutes. Chaque personne qui le dit boit une gorg\xE9e."
    },
    {
      id: "regard",
      name: "Le regard",
      chill: 3,
      hard: 2,
      kind: "regard",
      draws: false,
      rule: "Tout le monde fixe la table. Au top, chacun l\xE8ve les yeux vers quelqu'un. Si deux personnes se regardent : elles boivent une gorg\xE9e (pas de pioche)."
    },
    {
      id: "vote",
      name: "Vote secret",
      chill: 4,
      hard: 2,
      kind: "inapp_vote",
      rule: "Le joueur pose une question (ex : qui mourrait en premier dans un film d'horreur ?). Chacun vote en secret. Le plus vot\xE9 perd."
    },
    {
      id: "cascade",
      name: "Cascade",
      chill: 0,
      hard: 2,
      kind: "facilitator",
      rule: "Tout le monde boit en m\xEAme temps. Un joueur ne peut s'arr\xEAter que lorsque le pr\xE9c\xE9dent a repos\xE9 son verre."
    },
    {
      id: "russe",
      name: "Shot russe",
      chill: 0,
      hard: 3,
      kind: "facilitator",
      rule: "Le joueur pr\xE9pare plusieurs shots, un seul contient de l'alcool. Chacun en prend un \xE0 tour de r\xF4le."
    },
    {
      id: "duelsec",
      name: "Duel de sec",
      chill: 0,
      hard: 1,
      kind: "facilitator",
      rule: "Le joueur d\xE9fie un adversaire \xE0 un cul-sec. Les deux verres doivent avoir un volume similaire."
    },
    {
      id: "duelregard",
      name: "Duel de regard",
      chill: 1,
      hard: 1,
      kind: "facilitator",
      rule: "Le joueur d\xE9fie un adversaire : ils se fixent dans les yeux. Le premier qui rit ou d\xE9tourne perd."
    },
    {
      id: "enchere",
      name: "L'ench\xE8re",
      chill: 0,
      hard: 2,
      kind: "offapp",
      rule: "Le joueur d\xE9clare boire son verre en moins de X secondes. Le suivant surench\xE9rit ou crie \xAB menteur \xBB. Le perdant pioche."
    }
  ];
  const TYPE_META = {
    action: { color: "#ff3b5c", glow: "rgba(255,59,92,.55)", tag: "ACTION", ic: "\u{1F37A}" },
    diable: { color: "#b15bff", glow: "rgba(177,91,255,.55)", tag: "DIABLE", ic: "\u{1F608}" },
    jeu: { color: "#37a6ff", glow: "rgba(55,166,255,.55)", tag: "JEU", ic: "\u{1F3B2}" },
    joker: { color: "#27d17c", glow: "rgba(39,209,124,.55)", tag: "JOKER", ic: "\u{1F0CF}" }
  };
  const DICE = [null, "\u2680", "\u2681", "\u2682", "\u2683", "\u2684", "\u2685"];
  const PETITBAC_CATS = ["Pr\xE9nom", "Pays", "Alcool", "M\xE9tier", "Objet", "Animal"];
  const PETITBAC_LETTERS = "ABCDEFGHILMNOPRSTV";
  const TEN_MIN = 10 * 60 * 1e3;
  const CARD_INFO = {
    action: "Carte action. \xC0 ton tour : pose-la et tu bois la peine. Tu repioches 1 carte (ta main ne diminue pas). Ajoute un Diable pour refiler la peine \xE0 un autre joueur.",
    diable: "Carte diable. Se pose toujours AVEC une carte action : elle envoie la peine \xE0 un autre joueur. Action + diable = tu poses 2 cartes et n'en repioches qu'1 (ta main diminue).",
    joker: "Carte joker. Se joue uniquement EN R\xC9ACTION pour refuser un diable dirig\xE9 contre toi. Quand tu la joues, elle quitte ta main (ta main diminue)."
  };
  function makeUid(prefix, i) {
    return `${prefix}${i}_${Math.random().toString(36).slice(2, 7)}`;
  }
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function buildDeck(mode) {
    const deck = [];
    let n = 0;
    ACTION_CARDS.forEach((a) => {
      for (let i = 0; i < a[mode]; i++) deck.push({ id: makeUid("a", n++), type: "action", label: a.label, drink: a.drink });
    });
    GAMES.forEach((g) => {
      for (let i = 0; i < g[mode]; i++) deck.push({ id: makeUid("j", n++), type: "jeu", gameId: g.id, label: g.name });
    });
    for (let i = 0; i < 12; i++) deck.push({ id: makeUid("d", n++), type: "diable", label: "Diable" });
    for (let i = 0; i < 8; i++) deck.push({ id: makeUid("k", n++), type: "joker", label: "Joker" });
    return deck;
  }
  function clone(s) {
    return JSON.parse(JSON.stringify(s));
  }
  function game(id) {
    return GAMES.find((g) => g.id === id);
  }
  function newLobby(code, mode, host) {
    return {
      code,
      mode,
      status: "lobby",
      hostId: host.id,
      players: [{ id: host.id, name: host.name, photo: host.photo || null, hand: [] }],
      deck: [],
      discard: [],
      current: 0,
      winnerId: null,
      announce: null,
      reaction: null,
      minigame: null,
      timers: [],
      createdAt: Date.now()
    };
  }
  function dealNewGame(s0, starterIdx) {
    const s = clone(s0);
    const deck = shuffle(buildDeck(s.mode));
    s.players = s.players.map((p) => ({ ...p, hand: deck.splice(0, 7) }));
    s.deck = deck;
    s.discard = [];
    s.current = Math.max(0, Math.min(starterIdx, s.players.length - 1));
    s.status = "playing";
    s.winnerId = null;
    s.announce = note(`C'est parti ! ${s.players[s.current].name} commence \u{1F943}`);
    s.reaction = null;
    s.minigame = null;
    s.timers = [];
    return s;
  }
  function note(text) {
    return { text, ts: Date.now() + Math.random() };
  }
  function idx(s, id) {
    return s.players.findIndex((p) => p.id === id);
  }
  function isTurn(s, id) {
    return s.players[s.current] && s.players[s.current].id === id;
  }
  function draw(s, playerIdx, n = 1) {
    for (let k = 0; k < n; k++) {
      if (s.deck.length === 0) {
        s.deck = shuffle(s.discard);
        s.discard = [];
      }
      if (s.deck.length === 0) break;
      s.players[playerIdx].hand.push(s.deck.shift());
    }
  }
  function discardFrom(s, playerIdx, cardIds) {
    const removed = [];
    s.players[playerIdx].hand = s.players[playerIdx].hand.filter((c) => {
      if (cardIds.includes(c.id)) {
        removed.push(c);
        return false;
      }
      return true;
    });
    s.discard = [...removed, ...s.discard];
    return removed;
  }
  function advance(s) {
    s.current = (s.current + 1) % s.players.length;
  }
  function checkWinner(s) {
    const w = s.players.find((p) => p.hand.length === 0);
    if (w) {
      s.status = "finished";
      s.winnerId = w.id;
    }
  }
  function endTurn(s) {
    s.reaction = null;
    s.minigame = null;
    advance(s);
    checkWinner(s);
  }
  function initMinigame(s) {
    const g = game(s.minigamePending);
    const base = { gameId: g.id, kind: g.kind, draws: g.draws !== false, phase: "intro", launcherIdx: s.current };
    if (g.kind === "inapp_dice") return { ...base };
    if (g.kind === "inapp_vote") return { ...base, votes: {} };
    if (g.kind === "inapp_letter")
      return { ...base, letter: PETITBAC_LETTERS[Math.floor(Math.random() * PETITBAC_LETTERS.length)], endsAt: Date.now() + 90 * 1e3, answers: {} };
    return { ...base };
  }
  function applyMove(s0, move, myId) {
    const s = clone(s0);
    const me = idx(s, myId);
    if (me < 0) throw new Error("Tu n'es pas dans ce salon.");
    const mine = s.players[me];
    const launcher = s.minigame ? s.minigame.launcherIdx : s.current;
    const isLauncher = launcher === me;
    switch (move.type) {
      /* ---------- tour normal ---------- */
      case "pass": {
        requireTurn(s, myId);
        draw(s, me, 1);
        s.announce = note(`${mine.name} pioche une carte \u{1F0CF}`);
        endTurn(s);
        return s;
      }
      case "action": {
        requireTurn(s, myId);
        const card = handCard(mine, move.cardId, "action");
        discardFrom(s, me, [card.id]);
        draw(s, me, 1);
        s.announce = note(`${mine.name} ${card.drink} \u{1F37B}`);
        endTurn(s);
        return s;
      }
      case "actionDiable": {
        requireTurn(s, myId);
        const action = handCard(mine, move.cardId, "action");
